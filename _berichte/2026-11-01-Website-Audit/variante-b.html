let lang=new URLSearchParams(location.search).get('lang')||'en',choice=0,doc=0;const all={"en": {"nav": ["Toolkits", "Free tools", "How it works", "Account"], "eyebrow": "FOR BUSINESSES WITHOUT AN IT DEPARTMENT", "title": "Clear rules.<br>Evidence you can show.", "lead": "Turn your answers into an AI policy or a security evidence pack. With editable documents, dated sources and visible open points.", "primary": "Find your toolkit", "secondary": "Explore a sample", "proof": ["Made for your business", "Understand every decision", "Keep working with the files"], "prooftext": ["Documents generated from your answers.", "A handbook explains the reasoning and sources.", "PDF, Word and Excel, together in one ZIP."], "section": "What do you need to put in place?", "sectiontext": "Two document sets. Choose the task in front of you.", "names": ["AI Policy Toolkit", "Security Evidence Toolkit"], "tags": ["RULES FOR AI AT WORK", "ANSWERS FOR CUSTOMERS & INSURERS"], "desc": ["Decide which tools your team may use, what stays out and who checks the result.", "Document what is in place, what is missing and when you plan to address it."], "docs": [["AI usage policy and staff poster", "Tool register and briefing record", "Labelling checklist and enactment plan"], ["Security self-declaration and cover letter", "Action plan and evidence list", "Emergency card and clause checklist"]], "detail": "See the document set", "annual": "per year · no automatic renewal", "flowtitle": "From answers to a working document set", "flownames": ["Answer", "Review & download", "Put into practice"], "flowtext": ["Start from the fictional example and replace what differs.", "Check the preview and download editable files.", "Sign, brief your staff and keep a dated version."], "tooltitle": "A useful place to start", "tooldesc": "Check an AI input or spot obvious personal details in a text. The two checks run in your browser.", "toolbtn": "Explore free tools", "sample": "ILLUSTRATIVE SAMPLE · FICTIONAL BUSINE , die draußen bleiben", "Prüfung und Freigabe von Ergebnissen"], "docfoot": "Musterauszug · Vor Verwendung prüfen · Quellen im Handbuch", "stat": "Festgehalten", "stage": "IHR DOKUMENTENSATZ", "ready": "Dokumentvorschau", "tabs": ["Richtlinie", "Register", "Nachweis"], "guidedtitle": "Was steht bei Ihnen an?", "guidedlead": "Beginnen Sie mit Ihrer Aufgabe. Wir zeigen Ihnen den passenden Dokumentensatz.", "choices": ["Wir brauchen Regeln für KI.", "Ein Kunde fragt nach Sicherheitsnachweisen."], "choicetext": ["Geben Sie der Belegschaft einen klaren Rahmen.", "Bereiten Sie eine ehrliche, belegte Antwort vor."], "recommended": "DER PASSENDE DOKUMENTENSATZ", "librarytitle": "Ein Dokumentensatz.<br>Mit der Begründung dazu.", "librarylead": "Lesen Sie ein Muster, verstehen Sie die Quellen und erstellen Sie danach die Fassung für Ihren Betrieb.", "foot": "Quellenbasiert. Keine Rechtsberatung.", "concept": "DESIGNENTWURF · Kein Kauf und keine Kontoaktion · Vorhandener Preis nur zur Layoutprüfung", "modal": "Dies ist ein Designprototyp. Umfang, Preis und Lizenzbedingungen stehen auf der aktuellen Produktseite.", "live": "Aktuelle Produktseite öffnen", "sampletitle": "Ein Muster, das Sie lesen können", "sampletext": "Wechseln Sie zwischen den Dokumenten. Die Vorschau bleibt stehen, bis Sie selbst wechseln.", "more": "Dokumentdetails", "close": "Schließen", "menu": "Menü"}};const variant="b";

function stage(t){return `<div class="document-stage" id="sample"><div class="stage-top"><b>${t.stage}</b><span>PDF · DOCX · XLSX</span></div><div class="doc-tabs" role="tablist" aria-label="${t.ready}">${t.tabs.map((s,i)=>`<button role="tab" aria-selected="${doc===i}" onclick="setDoc(${i})">${s}</button>`).join('')}</div><div class="paper" role="tabpanel"><small>${t.sample}</small><h3>${doc===0?t.docname:doc===1?t.tabs[1]:t.tabs[2]}<br>${t.subhead}</h3><p>${doc===0?t.doctext:doc===1?(lang==='de'?'Welche Tools werden genutzt, über welchen Zugang und wer gibt sie frei?':'Which tools are used, through which accounts and who approves them?'):(lang==='de'?'Was ist geregelt, was bleibt offen und wer ist verantwortlich?':'What is recorded, what remains open and who is responsible?')}</p><div class="rule">${t.rule}</div><div class="rows">${t.rows.map(r=>`<div class="row"><span>${r}</span><span>${t.stat}</span></div>`).join('')}</div><div class="paper-footer">${t.docfoot}</div></div></div>`}
function cards(t){return t.names.map((n,i)=>`<article class="product"><span class="tag">${t.tags[i]}</span><h3>${n}</h3><p>${t.desc[i]}</p><ul>${t.docs[i].map(d=>`<li>${d}</li>`).join('')}</ul><div class="product-foot"><div class="price">€99<small>${t.annual}</small></div><button class="btn secondary" onclick="openProduct(${i})">${t.more} ↗</button></div></article>`).join('')}
function render(){let t=all[lang];document.documentElement.lang=lang;document.body.className=variant==='b'?'guided':variant==='c'?'library':'';document.getElementById('app').innerHTML=`<div class="review">${t.concept} · <a href="index.html">${lang==='de'?'Zum Bericht':'Audit & concepts'}</a></div><header class="bar"><div class="wrap nav"><a href="#top" class="brand"><span class="shield"></span>SCUTORIA</a><nav aria-label="Main"><a href="#products">${t.nav[0]}</a><a href="#tools">${t.nav[1]}</a><a href="#how">${t.nav[2]}</a></nav><button class="lang" onclick="toggleLang()">${lang==='en'?'Deutsch':'English'}</button><button class="menu" aria-expanded="false" onclick="toggleMenu(this)">${t.menu}</button></div><div id="mobileNav" class="mobile-nav"><a href="#products">${t.nav[0]}</a><a href="#tools">${t.nav[1]}</a><a href="#how">${t.nav[2]}</a><a href="https://scutoria.com/account">${t.nav[3]} ↗</a></div></header><main id="top" class="wrap">${variant==='b'?`<section class="hero"><div class="eyebrow">${t.eyebrow}</div><h1>${t.guidedtitle}</h1><p class="lead">${t.guidedlead}</p><div class="choice-grid">${t.choices.map((c,i)=>`<button class="choice" aria-pressed="${choice===i}" onclick="setChoice(${i})"><small>${t.tags[i]}</small><strong>${c}</strong><span>${t.choicetext[i]}</span></button>`).join('')}</div></section><div class="recommend"><div><div class="eyebrow">${t.recommended}</div><h3>${t.names[choice]}</h3><p>${t.desc[choice]}</p></div><button class="btn" onclick="openProduct(${choice})">${t.detail} →</button></div>`:`<section class="hero"><div><div class="eyebrow">${t.eyebrow}</div><h1>${variant==='c'?t.librarytitle:t.title}</h1><p class="lead">${variant==='c'?t.librarylead:t.lead}</p><div class="actions"><a class="btn" href="#products">${t.primary} →</a><a class="btn secondary" href="#sample">${t.secondary}</a></div><div class="meta">${t.foot}</div></div>${stage(t)}</section>`}<div class="proof-strip">${t.proof.map((p,i)=>`<div><b>${p}</b><p>${t.prooftext[i]}</p></div>`).join('')}</div><section class="section" id="products"><div class="section-title"><h2>${t.section}</h2><p>${t.sectiontext}</p></div><div class="products">${cards(t)}</div></section><section class="section" id="how"><div class="section-title"><h2>${t.flowtitle}</h2></div><div class="flow">${t.flownames.map((n,i)=>`<div><span class="number">${i+1} / 3</span><h3>${n}</h3><p>${t.flowtext[i]}</p></div>`).join('')}</div></section>${variant==='b'?`<section class="section"><div class="section-title"><h2>${t.sampletitle}</h2><p>${t.sampletext}</p></div>${stage(t)}</section>`:''}<section class="section" id="tools"><div class="tools"><div><h3>${t.tooltitle}</h3><p>${t.tooldesc}</p></div><a class="btn secondary" href="https://scutoria.com/${lang==='de'?'de/':''}tools">${t.toolbtn} ↗</a></div></section></main><footer class="footer"><div class="wrap"><div><b>SCUTORIA</b><p>${t.foot}</p></div><div><a href="https://scutoria.com/${lang==='de'?'de/impressum':'legal'}">${lang==='de'?'Impressum':'Legal notice'}</a> · <a href="https://scutoria.com/${lang==='de'?'de/datenschutz':'privacy'}">${lang==='de'?'Datenschutz':'Privacy'}</a> · kontakt@scutoria.com</div></div></footer><div class="design-links"><a href="variante-a.html?lang=${lang}">A · Product clarity</a><a href="variante-b.html?lang=${lang}">B · Guided choice</a><a href="variante-c.html?lang=${lang}">C · Document desk</a></div><p class="endnote">${lang==='de'?'Gestaltungsvorschlag vom 01.11.2026. Inhalte und Musterdokument sind Entwurfsbeispiele. Keine Zusage zur Funktionsweise oder Rechtslage.':'Design concept dated 1 November 2026. Copy and sample document are illustrative drafts. No claims about legal compliance or verified product behaviour.'}</p><dialog id="details"><button class="close" aria-label="${t.close}" onclick="this.closest('dialog').close()">×</button><div id="dialogContent"></div></dialog>`;}
function toggleLang(){lang=lang==='en'?'de':'en';render()}function setChoice(i){choice=i;render()}function setDoc(i){doc=i;let t=all[lang],holder=document.getElementById('sample');holder.outerHTML=stage(t)}function toggleMenu(b){let open=document.getElementById('mobileNav').classList.toggle('open');b.setAttribute('aria-expanded',open)}function openProduct(i){let t=all[lang];document.getElementById('dialogContent').innerHTML=`<div class="eyebrow">${t.tags[i]}</div><h2>${t.names[i]}</h2><p>${t.desc[i]}</p><ul>${t.docs[i].map(s=>`<li>${s}</li>`).join('')}</ul><p>${t.modal}</p><a class="btn" href="${lang==='en'?products[i]:i===0?'https://scutoria.com/de/toolkits/ki-richtlinien':'https://scutoria.com/de/toolkits/sicherheitsnachweis'}">${t.live} ↗</a>`;document.getElementById('details').showModal()}render();

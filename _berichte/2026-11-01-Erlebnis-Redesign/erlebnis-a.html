function relevance(){let c=t();return `<section class="section relevance"><div><div class="kicker">${c.discover}</div><h2>${c.discoverTitle}</h2><p>${c.discoverText}</p></div><div class="relevance-cards">${c.scenarios.map((s,i)=>`<div class="relevance-card"><span class="symbol" aria-hidden="true">${['?','↗','!'][i]}</span><div><h3>${c.scenarioQuestions[i]}</h3><p>${c.sceneText[i]}</p></div></div>`).join('')}</div></section>`}
function method(){let c=t();return `<section class="section" id="method"><div class="section-top"><div><div class="kicker">SCUTORIA · ${c.methodcta}</div><h2>${c.whytitle}</h2></div><p>${c.whylead}</p></div><div class="method-grid">${c.method.map((s,i)=>`<button class="method-item" onclick="showMethod(${i})"><span class="method-marker" aria-hidden="true"></span><strong>${s}</strong><p>${c.methodtext[i]}</p></button>`).join('')}</div></section>`}
function products(){let c=t();return `<section class="section" id="products"><div class="section-top"><div><div class="kicker">${c.productsEyebrow}</div><h2>${c.productsTitle}</h2></div><p>${c.productsLead}</p></div><div class="products">${c.products.map((n,i)=>`<article class="product"><div class="book" aria-hidden="true"><small>SCUTORIA</small><strong>${n}</strong><small>${c.productFormats}</small></div><div><div class="purpose">${c.productUse[i]}</div><h3>${n}</h3><p>${c.productDescs[i]}</p><div class="formats">${c.productFormats}</div><button class="button" onclick="showProduct(${i})">${c.productBtn} ↗</button><p style="font-size:10px;margin-top:12px">${c.scope}</p></div></article>`).join('')}</div></section><section class="section"><div class="section-top"><h2>${c.journeyTitle}</h2></div><div class="journey">${c.journey.map((s,i)=>`<div><span class="step-num">${i+1} / 3</span><h3>${s}</h3><p>${c.journeyDesc[i]}</p></div>`).join('')}</div></section>`}
function render(){let c=t();document.documentElement.lang=lang;document.body.className=(V==='b'?'orbit-layout':V==='c'?'guide-layout':'atelier-layout')+(motion?'':' motion-off');$('#app').innerHTML=`<div class="prototype">${c.concept}<a href="index.html">${c.back}</a></div><header class="header"><div class="container nav"><a class="brand" href="#top">${shield}SCUTORIA</a><nav class="navlinks" aria-label="Main">${c.nav.map((n,i)=>`<a href="#${['explore','try','products','method'][i]}">${n}</a>`).join('')}<a href="https://scutoria.com/${lang==='de'?'de/konto':'account'}">${c.account} ↗</a></nav><div class="utility"><button class="smallbtn motion-control" aria-pressed="${motion}" onclick="toggleMotion()">${c.motion}: ${motion?c.on:c.off}</button><button class="smallbtn" onclick="toggleLang()">${lang==='en'?'Deutsch':'English'}</button><button class="smallbtn mobile-menu" aria-expanded="false" aria-controls="mobileNav" onclick="toggleMenu(this)">${c.menu}</button></div></div><nav class="mobile-nav" id="mobileNav" aria-label="Mobile">${c.nav.map((n,i)=>`<a onclick="closeMenu()" href="#${['explore','try','products','method'][i]}">${n}</a>`).join('')}<a href="https://scutoria.com/${lang==='de'?'de/konto':'account'}">${c.account} ↗</a></nav></header><main class="container" id="top">${hero()}${relevance()}${toolDemo()}${method()}${products()}<section class="end"><h2>${c.endTitle}</h2><p>${c.endText}</p><div class="actions"><a class="button" href="#try">${c.nav[1]} →</a><a class="button ghost" href="#products">${c.secondary}</a></div></section></main><footer class="footer"><div class="container"><div><b>SCUTORIA</b><p>${c.footer}</p></div><div class="footer-links"><a href="https://scutoria.com/${lang==='de'?'de/impressum':'legal'}">${c.legal}</a> · <a href="https://scutoria.com/${lang==='de'?'de/datenschutz':'privacy'}">${c.privacy}</a> · kontakt@scutoria.com</div></div></footer><p class="fineprint">${c.prototypeNote}</p><div class="variants"><a href="${localURL('erlebnis-a.html')}">A · Evidence in motion</a><a href="${localURL('erlebnis-b.html')}">B · Connected business</a><a href="${localURL('erlebnis-c.html')}">C · Living field guide</a></div><dialog class="dialog" id="dialog" aria-labelledby="dialogTitle"><button class="close" onclick="closeDialog()">${c.close}</button><div id="dialogContent"></div></dialog>`;}
function toggleLang(){if(seqTimer)clearTimeout(seqTimer);lang=lang==='en'?'de':'en';render()}
function toggleMotion(){motion=!motion;if(seqTimer)clearTimeout(seqTimer);if($('#bench')){setStep(2);$('#bench').classList.remove('sequencing');}document.body.classList.toggle('motion-off',!motion);let c=t(),b=$('.motion-control');b.textContent=c.motion+': '+(motion?c.on:c.off);b.setAttribute('aria-pressed',motion)}
function toggleMenu(b){let open=$('#mobileNav').classList.toggle('open');b.setAttribute('aria-expanded',open)}function closeMenu(){let b=$('.mobile-menu');if(b)b.setAttribute('aria-expanded','false');$('#mobileNav').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function chooseStep(i){if(seqTimer){clearTimeout(seqTimer);seqTimer=null;}let b=$('#bench');if(b)b.classList.remove('sequencing');setStep(i)}
function setStep(i){step=i;$('#sheetContent').outerHTML=sheet();document.querySelectorAll('.worksteps button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j))}
function openChapter(i){setScene(i);$('#explore').scrollIntoView({behavior:motion?'smooth':'auto',block:'start'})}
function setScene(i){if(seqTimer)clearTimeout(seqTimer);scene=i;step=2;let c=t();if($('#sheetContent'))setStep(2);document.querySelectorAll('.segments button,.chapter').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));let context=$('.story-context');if(context)context.innerHTML=`<div class="kicker">${c.sceneTags[i]}</div><h2>${c.scenarioQuestions[i]}</h2><p>${c.sceneText[i]}</p>`;}
function replay(){if(seqTimer)clearTimeout(seqTimer);if(!motion||matchMedia('(prefers-reduced-motion: reduce)').matches){setStep(2);return}let b=$('#bench');b.classList.remove('sequencing');void b.offsetWidth;b.classList.add('sequencing');setStep(0);seqTimer=setTimeout(()=>{setStep(1);seqTimer=setTimeout(()=>{setStep(2);b.classList.remove('sequencing')},950)},950)}
function setNode(i){node=i;let c=t();let pos=[[120,108],[300,64],[468,124],[390,300],[150,304]][i];$('.active-line').setAttribute('d',`M${pos[0]} ${pos[1]} Q300 200 300 200`);document.querySelectorAll('.node').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));$('.map-info').innerHTML=`<div class="kicker">${c.nodes[i]} · ${c.graphTitle}</div><h3>${c.nodeQ[i]}</h3><p>${c.nodeDesc[i]}</p><button class="button ghost" onclick="showExample()">${c.graphCta} ↗</button><div class="mapfoot">${c.connection}</div>`;$('.map-info').classList.remove('revealed');void $('.map-info').offsetWidth;$('.map-info').classList.add('revealed')}
function toggleMask(){masked=!masked;let c=t();$('#demo').classList.toggle('safe',masked);$('.demo-text').innerHTML=masked?c.textAfter:c.textBefore;$('.demo-text').classList.remove('document-enter');void $('.demo-text').offsetWidth;$('.demo-text').classList.add('document-enter');$('#maskStatus').textContent=masked?c.after:c.before;$('.demo-controls button').textContent=(masked?c.reset:c.toolBtn)+' ↔';}
let opener=null;function openDialog(body){opener=document.activeElement;$('#dialogContent').innerHTML=body;$('#dialog').showModal()}function closeDialog(){$('#dialog').close();if(opener&&document.contains(opener))opener.focus()}
function showMethod(i){let c=t();openDialog(`<div class="kicker">SCUTORIA · ${i===undefined?c.methodcta:c.method[i]}</div><h2 id="dialogTitle">${i===undefined?c.whytitle:c.method[i]}</h2><p>${i===undefined?c.whylead:c.methodtext[i]}</p><p>${c.whybody}</p><a class="button ghost" href="https://scutoria.com/${lang==='de'?'de/toolkits/ki-richtlinien/handbuch':'toolkits/ai-policy/handbook'}">${lang==='de'?'Aktuelles Handbuch öffnen':'Open the current handbook'} ↗</a>`)}
function showProduct(i){let c=t();openDialog(`<div class="kicker">${c.productUse[i]}</div><h2 id="dialogTitle">${c.products[i]}</h2><p>${c.productDescs[i]}</p><ul>${c.docrows[i].map(s=>`<li>${s}</li>`).join('')}</ul><p>${c.productDialog}</p><a class="button" href="${livePath('product',i)}">${c.live} ↗</a>`)}
function showExample(){let c=t();openDialog(`<div class="kicker">${c.evidence}</div><h2 id="dialogTitle">${c.doctitles[0]}</h2><p>${c.sampleName}</p><ul>${c.docrows[0].map(s=>`<li>${s}</li>`).join('')}</ul><p>${c.docnote}</p><button class="button ghost" onclick="closeDialog();showMethod()">${c.source} ↗</button>`)}
render();document.addEventListener('visibilitychange',()=>{if(document.hidden&&seqTimer){clearTimeout(seqTimer);seqTimer=null;let b=$('#bench');if(b){b.classList.remove('sequencing');setStep(2)}}});
</script></body></html>

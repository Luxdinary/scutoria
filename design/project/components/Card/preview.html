<!-- @dsCard group="Display" height=330 -->
<div class="sc-preview">
  <div class="sc-cards">
    <article class="sc-card">
      <div class="sc-card__kicker">Free · 3 minutes</div>
      <h3 class="sc-card__title">Does NIS2 apply to my business?</h3>
      <p class="sc-card__text">Ten questions, then a memo with the relevant articles and the date we last checked them.</p>
      <div class="sc-card__actions"><button class="sc-btn" type="button">Start the check</button></div>
    </article>
    <article class="sc-card">
      <div class="sc-card__kicker">Free · 1 minute</div>
      <h3 class="sc-card__title">May this go into the chat?</h3>
      <p class="sc-card__text">Three questions about the task, then green, amber or red with the reason. Nothing is sent anywhere.</p>
      <div class="sc-card__actions"><button class="sc-btn" type="button">Open the traffic light</button><button class="sc-btn sc-btn--secondary" type="button">How it works</button></div>
    </article>
  </div>
</div>

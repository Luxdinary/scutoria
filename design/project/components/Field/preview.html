<!-- @dsCard group="Controls" height=300 -->
<div class="sc-preview sc-stack" style="gap:24px">
  <label class="sc-field">
    <span class="sc-field__label">Company name as it should appear on the documents</span>
    <input class="sc-field__input" type="text" value="Example Ltd" aria-label="Company name">
    <span class="sc-field__hint">Used on the policy, the register and the evidence page.</span>
  </label>
  <label class="sc-field sc-field--error">
    <span class="sc-field__label">Number of staff</span>
    <input class="sc-field__input" type="text" value="twelve" aria-label="Number of staff">
    <span class="sc-field__hint">Enter a number, for example 12.</span>
  </label>
</div>

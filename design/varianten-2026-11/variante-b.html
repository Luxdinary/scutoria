<title>Scutoria Variante Verlag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --ground:#edf3f9;--surface:#ffffff;--raised:#f4f7fb;--ink:#102d4d;--muted:#5a6b80;--hair:#cfdae7;
  --accent:#245ce5;--accent-strong:#1a49bd;--ultra:#194be0;--ultra-deep:#1440c2;--light:#edf3fa;
  --paper:#fbfbfd;--paper-ink:#141a24;--paper-muted:#5a6472;--paper-hair:rgba(20,26,36,.12);
  --m-fact:#1f5fd1;--m-interpretation:#6b3fc9;--m-uncertain:#7a4b00;--m-gap:#b42318;
  --line-policy:#4f8cff;--line-security:#2ec4b6;--line-setup:#f2b544;--line-foundations:#cfd6e3;
  --cover-a:#11151d;--cover-b:#090b10;--cover-ink:#ffffff;--cover-soft:#cfd6e3;--cover-brand:#7aa2ff;
  --sig-green:#0f766e;--sig-amber:#b4700a;--sig-red:#b42318;
  --sans:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --shadow-card:0 1px 2px rgba(16,45,77,.06),0 16px 40px rgba(16,45,77,.10);
  --shadow-paper:0 1px 1px rgba(16,45,77,.10),0 6px 14px rgba(16,45,77,.12),0 24px 48px rgba(16,45,77,.18);
  --radius:16px;--radius-lg:24px;--max:1240px;
}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:var(--accent)}
a:hover{color:var(--accent-strong)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.small{font-size:14px;line-height:1.5}
.muted{color:var(--muted)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
p{margin:0 0 14px;max-width:65ch}
.kicker{font:700 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
.display{font-size:clamp(2.6rem,1.4rem + 4.2vw,4.6rem);line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:0 0 22px;text-wrap:balance;max-width:16ch}
.display--s{font-size:clamp(2.2rem,1.4rem + 2.8vw,3.6rem);max-width:20ch}
.title{font-size:clamp(1.75rem,1.4rem + 1.3vw,2.4rem);line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.heading{font-size:clamp(1.2rem,1.1rem+.4vw,1.45rem);line-height:1.25;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
.lead{font-size:clamp(1.12rem,1.02rem+.5vw,1.35rem);line-height:1.5;color:var(--muted);max-width:60ch;margin:0 0 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;transition:background-color 180ms,color 180ms,border-color 180ms,transform 180ms}
.btn:hover{transform:translateY(-1px)}
.btn--primary{background:var(--ultra);color:#fff}
.btn--primary:hover{background:var(--ultra-deep);color:#fff}
.btn--ghost{background:transparent;border-color:rgba(16,45,77,.4);color:var(--ink)}
.btn--ghost:hover{border-color:var(--ink);background:#fff;color:var(--ink)}
.btn--white{background:#fff;color:var(--ultra)}
.btn--white:hover{background:#fff;color:var(--ultra-deep)}
.btn--onblue{border-color:rgba(255,255,255,.65);color:#fff}
.btn--onblue:hover{background:rgba(255,255,255,.12);color:#fff}
.btn--icon{min-width:48px;padding:0;font-size:22px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px}
.section{padding-block:clamp(48px,3vw + 28px,96px)}
.section--tight{padding-block:32px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.shead p{margin:0}
.rev{opacity:0;transform:translateY(12px);transition:opacity 600ms cubic-bezier(.2,.8,.2,1),transform 600ms cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rev.in{opacity:1;transform:none}
.no-motion .rev{opacity:1;transform:none;transition:none}
.no-motion *{transition-duration:0ms!important;animation-duration:0ms!important;scroll-behavior:auto!important}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.bar__in{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:26px;height:26px;color:var(--accent)}
.wordmark{font-weight:800;letter-spacing:.14em;font-size:15px}
.nav{display:flex;gap:4px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;text-decoration:none;color:var(--ink);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.nav a[aria-current="page"]{color:var(--ultra);border-bottom-color:var(--ultra)}
.bar__tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar__link{text-decoration:none;color:var(--ink);font-weight:600;padding:0 10px;min-height:44px;display:inline-flex;align-items:center}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--hair);background:#fff;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;transition:border-color 180ms,background-color 180ms}
.chip:hover{border-color:var(--ink)}
.chip--draft{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;background:var(--light);color:var(--ultra);border-color:transparent}
@media (max-width:760px){.nav{order:3;flex-basis:100%;margin-left:0;flex-wrap:wrap;overflow:visible}.bar__tools{margin-left:auto}}

/* Hero */
.hero{padding-top:clamp(40px,5vw,72px)}
.band{background:var(--ultra);color:#fff;border-radius:var(--radius-lg);padding:clamp(24px,3.4vw,52px);display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,3vw,48px);align-items:start;box-shadow:var(--shadow-card);margin-top:44px}
.band .kicker{color:rgba(255,255,255,.82)}
.band p{color:#fff}
.band__note{color:rgba(255,255,255,.78)!important;margin-top:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.62);color:#fff;font-weight:600;transition:background-color 180ms,color 180ms,border-color 180ms}
.pill:hover{background:rgba(255,255,255,.14)}
.pill[aria-pressed="true"]{background:#fff;color:var(--ultra);border-color:#fff}
.steplabel{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8)!important;margin:0 0 6px}
.question{font-size:clamp(1.2rem,1.05rem+.7vw,1.55rem);font-weight:600;line-height:1.35;margin:0 0 20px;max-width:28ch}
.sitwrap{transition:opacity 240ms,transform 240ms}
.sitwrap.swap{opacity:0;transform:translateY(12px)}
.band__art{margin:0;position:relative}
.band__art img{border-radius:20px;box-shadow:0 24px 48px rgba(9,20,60,.38);outline:1px solid rgba(255,255,255,.55);outline-offset:-1px;transform:translate(0,36px)}
.band__art figcaption{margin-top:48px;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.7)}
@media (min-width:1320px){.band__art img{transform:translate(24px,36px)}}
@media (max-width:900px){.band{grid-template-columns:1fr}.band__art img{transform:none}.band__art figcaption{margin-top:10px}}

/* Papierblatt */
.paperwrap{position:relative;max-width:520px}
.paperwrap::before{content:"";position:absolute;inset:10px -14px -10px 14px;background:#fff;border-radius:6px;box-shadow:var(--shadow-paper);opacity:.92}
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px 24px 18px;box-shadow:var(--shadow-paper);border:1px solid var(--paper-hair)}
.paper p{color:var(--paper-ink);max-width:none}
.paper--tilt{transform:rotate(-1.5deg)}
.hero-sheet .paper{animation:settle 700ms cubic-bezier(.2,.8,.2,1) both}
@keyframes settle{from{opacity:0;transform:translateY(14px) rotate(-3deg)}to{opacity:1;transform:translateY(0) rotate(-1.5deg)}}
.paper__head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 12px/1.4 var(--mono);letter-spacing:.08em;color:var(--paper-muted);margin-bottom:10px}
.paper__title{font-weight:800;font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
.paper__line{margin:0 0 8px;font-size:15px;line-height:1.5;padding-left:12px;border-left:3px solid var(--m-fact)}
.paper__source{font:400 12px/1.45 var(--mono);color:var(--paper-muted)!important;margin:14px 0 0;border-top:1px solid var(--paper-hair);padding-top:10px}
.paper__step{display:block;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:10px;margin-bottom:4px}

/* Buchobjekt */
.book{position:relative;width:min(100%,var(--w,160px));aspect-ratio:3/4;display:block;transition:transform 240ms cubic-bezier(.2,.8,.2,1);flex:0 0 auto}
.book__face{position:absolute;inset:0;border-radius:4px 10px 10px 4px;background:linear-gradient(180deg,var(--cover-a),var(--cover-b));color:var(--cover-ink);padding:calc(var(--w,160px)*.09) calc(var(--w,160px)*.08) calc(var(--w,160px)*.08) calc(var(--w,160px)*.12);display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.3),0 20px 50px rgba(16,45,77,.22);overflow:hidden}
.book__spine{position:absolute;left:0;top:0;bottom:0;width:calc(var(--w,160px)*.05);background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(0,0,0,.4));border-radius:4px 0 0 4px;z-index:2}
.book__stripe{display:block;height:calc(var(--w,160px)*.04);width:35%;background:var(--line);border-radius:3px;margin-bottom:calc(var(--w,160px)*.08)}
.book__no{font:500 calc(var(--w,160px)*.062)/1.2 var(--mono);letter-spacing:.14em;color:var(--cover-brand);margin-bottom:auto}
.book__title{display:block;font-weight:800;font-size:calc(var(--w,160px)*.105);line-height:1.12;letter-spacing:-.01em;margin:calc(var(--w,160px)*.06) 0}
.book__series{font:400 calc(var(--w,160px)*.052)/1.3 var(--mono);letter-spacing:.12em;color:var(--cover-soft)}
.book--concept .book__face{background:var(--raised);color:var(--ink);box-shadow:none;border:1.5px dashed var(--hair)}
.book--concept .book__spine{background:linear-gradient(90deg,rgba(16,45,77,.08),rgba(16,45,77,.16))}
.book--concept .book__no,.book--concept .book__series{color:var(--muted)}
.book--concept .book__stripe{opacity:.45}
.book__pill{position:absolute;right:8px;top:8px;z-index:3;font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:999px;border:1px solid var(--hair);background:#fff;color:var(--muted)}
.card:hover .book,.card:focus-visible .book,.pcard:hover .book,.object:hover .book{transform:translateY(-8px) rotate(-3deg)}

/* Status */
.status{display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid var(--hair);background:#fff;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--hair));flex:0 0 auto}
.status--available{color:var(--ink)}
.status--concept{border-style:dashed}
.status--production{color:var(--ink)}

/* Startseite */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.path{display:grid;gap:10px;align-content:start;padding:24px 0 0;border-top:2px solid var(--ink);text-decoration:none;color:inherit;transition:border-color 200ms}
.path:hover{border-top-color:var(--ultra)}
.path:hover .heading{color:var(--ultra)}
.path__icon{width:28px;height:28px;color:var(--accent)}
.path__icon svg{width:100%;height:100%}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.pcard{display:grid;grid-template-columns:200px 1fr;gap:28px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-card)}
.pcard__stage{background:var(--raised);border-radius:16px;padding:24px 16px;display:flex;justify-content:center;align-items:center}
.pcard .title{font-size:clamp(1.5rem,1.3rem+.8vw,2rem)}
.pcard__price{font-size:15px}
.pcard__price strong{font:500 26px/1 var(--mono);letter-spacing:-.02em;margin-right:6px}
.pcard--slim{grid-template-columns:120px 1fr;align-items:center;background:var(--light);box-shadow:none}
.pcard--slim .pcard__stage{background:#fff}
.how__rule{height:2px;background:var(--hair);position:relative;margin:8px 0 36px}
.how__rule::after{content:"";position:absolute;inset:0;background:var(--ultra);transform:scaleX(var(--fill,0));transform-origin:left;transition:transform 400ms linear}
.how__steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;list-style:none;margin:0;padding:0}
.how__no{display:block;font:500 13px/1 var(--mono);letter-spacing:.14em;color:var(--ultra);margin-bottom:14px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.q{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:26px}
.q .heading{margin-bottom:10px}
.q p{margin:0}
.markers{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.marker{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:24px}
.marker svg{width:48px;height:48px;display:block;margin-bottom:14px}
.marker .shp{transition:transform 500ms cubic-bezier(.2,.8,.2,1),opacity 500ms;transform:scale(.5);opacity:0;transform-origin:center;transform-box:fill-box}
.marker.drawn .shp{transform:none;opacity:1}
.marker .stk{stroke-dasharray:64;stroke-dashoffset:64;transition:stroke-dashoffset 600ms ease}
.marker.drawn .stk{stroke-dashoffset:0}
.no-motion .marker .shp{transform:none;opacity:1}
.no-motion .marker .stk{stroke-dashoffset:0}
.marker p{margin:0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.linkcard{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:26px;transition:box-shadow 240ms,transform 240ms}
.linkcard:hover{box-shadow:var(--shadow-card);transform:translateY(-4px);color:inherit}
.linkcard .heading{margin:8px 0 6px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tcard{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:22px;text-decoration:none;color:inherit;transition:box-shadow 240ms,transform 240ms}
.tcard:hover{box-shadow:var(--shadow-card);transform:translateY(-4px);color:inherit}
.tcard p{margin:0}
.waitlist{background:var(--light);border-radius:var(--radius-lg);padding:clamp(28px,4vw,56px);display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.waitlist form{display:grid;gap:10px}
.waitlist input{min-height:48px;padding:0 16px;border:1.5px solid rgba(16,45,77,.4);border-radius:12px;font:inherit;background:#fff;width:100%}
.formnote{min-height:1.5em}

/* Bibliothek */
.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0 28px}
.search input{min-height:48px;width:min(100%,360px);padding:0 16px;border:1.5px solid rgba(16,45,77,.4);border-radius:12px;font:inherit;background:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--hair);background:#fff;font-weight:600;transition:background-color 180ms,color 180ms,border-color 180ms}
.filter:hover{border-color:var(--ink)}
.filter[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar .count{margin-left:auto}
.catalog{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{display:block;text-align:left;width:100%;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:16px;transition:box-shadow 240ms,transform 240ms}
.card:hover{box-shadow:var(--shadow-card);color:inherit}
.card--concept{background:transparent;border-style:dashed}
.card__stage{background:var(--raised);border-radius:12px;padding:22px 16px;display:flex;justify-content:center;margin-bottom:14px}
.card--concept .card__stage{background:transparent;border:1px solid var(--hair)}
.card__meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card .heading{font-size:1.05rem;margin-bottom:6px}
.card p{margin:0}
.empty{padding:40px 0;color:var(--muted)}

/* Produktseite */
.pband{margin:0 0 28px}
.pband img{width:100%;height:clamp(160px,22vw,280px);object-fit:cover;border-radius:var(--radius-lg);outline:1px solid rgba(255,255,255,.6);outline-offset:-1px;box-shadow:var(--shadow-card)}
.pband figcaption{margin-top:8px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.spread{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius-lg);display:grid;grid-template-columns:1.25fr 1fr;box-shadow:var(--shadow-card);overflow:hidden}
.spread__l{padding:clamp(24px,4vw,56px);border-right:1px solid var(--hair)}
.spread__r{padding:clamp(24px,4vw,56px);background:var(--raised)}
.object{display:flex;justify-content:center;padding:24px 0 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin:28px 0 20px;overflow-x:auto;scrollbar-width:none}
.tab{min-height:44px;padding:0 14px;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color 180ms,border-color 180ms}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ultra);border-bottom-color:var(--ultra)}
.panel ol,.panel ul{padding-left:22px;margin:0 0 14px}
.panel li{margin-bottom:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:0 0 18px;padding:0}
.facts div{border-top:1px solid var(--hair);padding-top:10px}
.facts dt{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.facts dd{margin:0;font-weight:600}
.pricecard{background:#fff;border:1px solid var(--hair);border-radius:var(--radius);padding:26px;margin-top:20px}
.price{font:500 56px/1 var(--mono);letter-spacing:-.03em;margin:0 0 10px}
.pricecard .btn{margin:10px 0 12px}
.markerbar{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--hair)}
.mk{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);letter-spacing:.08em}
.mk svg{width:18px;height:18px}

/* Tools */
.toolgrid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.toollist{display:grid;gap:8px}
.toolbtn{display:grid;gap:4px;text-align:left;min-height:56px;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;background:#fff;transition:border-color 180ms,background-color 180ms}
.toolbtn:hover{border-color:var(--ink)}
.toolbtn[aria-pressed="true"]{border-color:var(--ultra);background:var(--light)}
.toolbtn--concept{color:var(--muted);border-style:dashed;background:transparent}
.toolbtn .small{color:var(--muted)}
.work{background:#fff;border:1px solid var(--hair);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card)}
.work__head{background:var(--ink);color:#fff;padding:24px 28px}
.work__head .kicker{color:rgba(255,255,255,.72)}
.work__head p{color:rgba(255,255,255,.85);margin:0}
.work__head .heading{margin-bottom:8px}
.work__body{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px 28px}
.work__body label,.work__body .label{display:block;font:500 12px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:170px;padding:14px;border:1.5px solid rgba(16,45,77,.4);border-radius:12px;font:inherit;font-size:15px;resize:vertical;background:#fff;color:var(--ink)}
.out{min-height:170px;padding:14px;border-radius:12px;background:var(--raised);border:1px solid var(--hair);white-space:pre-wrap;word-break:break-word;font:400 14px/1.5 var(--mono)}
.work__foot{display:flex;gap:12px;flex-wrap:wrap;padding:0 28px 22px}

.poster__meta{font:500 11px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cover-soft)}

.featured{display:grid;grid-template-columns:3fr .95fr .95fr;gap:20px;align-items:stretch;margin-bottom:16px}

.railnav{display:flex;gap:8px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 18px;scrollbar-width:thin}
.rail>*{flex:0 0 190px;scroll-snap-align:start}
.programme{border-top:1px solid var(--hair)}
.prog{display:grid;grid-template-columns:56px 1fr auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--hair);align-items:start}

.dlg{border:0;border-radius:var(--radius-lg);padding:0;max-width:min(92vw,640px);width:100%;background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(16,45,77,.3)}

      var p = A.prod(v.product), t = v.tool ? A.toolById(v.tool) : null;
      return '<div class="prog"><span class="prog__no" style="--line:' + A.lineColor(v.line) + '">' + v.no + '</span><div><button class="prog__title" data-act="video" data-no="' + v.no + '">' + T(v.title) + '</button>' +
        '<div class="prog__links"><span class="mono small muted">' + u.related + ':</span>' + A.ext(live(T(p.url)), T(p.name)) + (t ? A.ext(live(T(t.url)), u.relatedTool + ': ' + T(t.name)) : '') + A.ext(live(T(p.handbook)), u.relatedHandbook) + '</div></div>' +
        A.statusPill(v.status, v.line) + '</div>';
    }).join('');
    return '<section class="section"><div class="wrap"><p class="kicker">SCUTORIA / ' + u.studio + '</p><h1 class="display display--s">' + u.studioTitle + '</h1><p class="lead">' + u.studioIntro + '</p>' +
      '<div class="chapter"><p class="chapter__no">' + chap + ' 01</p><div><h2 class="title">' + u.studioFeatured + '</h2><div class="featured">' + A.poster(S.videos[0], 'wide') + A.shortPoster(S.shorts[1]) + A.shortPoster(S.shorts[2]) + '</div><p class="small muted">' + u.noVideoNote + '</p></div></div>' +
      '<div class="chapter"><p class="chapter__no">' + chap + ' 02</p><div><div class="shead"><h2 class="title">' + u.studioShorts + '</h2><div class="railnav"><button class="btn btn--ghost btn--icon" data-act="rail" data-dir="-1" aria-label="' + A.word('Zurück', 'Back') + '">‹</button><button class="btn btn--ghost btn--icon" data-act="rail" data-dir="1" aria-label="' + A.word('Weiter', 'Next') + '">›</button></div></div>' +
      '<div class="rail" id="rail">' + S.shorts.map(A.shortPoster).join('') + '</div></div></div>' +
      '<div class="chapter"><p class="chapter__no">' + chap + ' 03</p><div><h2 class="title">' + u.studioProgramme + '</h2><div class="programme">' + rows + '</div></div></div></div></section>';
  };
})();
</script>
<script>
(function () {
  'use strict';
  var A = window.SCAPP, S = A.S, st = A.st, T = A.T, U = A.U, live = A.live, href = A.href, $ = A.$, $$ = A.$$;

  function videoDialog(no) {
    var u = U(), v = S.videos.filter(function (x) { return x.no === no; })[0];
    if (!v) return;
    var p = A.prod(v.product), t = v.tool ? A.toolById(v.tool) : null, lw = u.studioFeatured.replace(/\s*01$/, '');
    A.openDialog('<p class="kicker">' + lw + ' ' + v.no + ' · DE · EN · ' + A.statusLabel(v.status) + '</p><h2 class="title" id="dlgTitle">' + T(v.title) + '</h2><p>' + u.noVideoNote + '</p>' +
      '<p class="kicker">' + u.related + '</p><ul class="links"><li>' + A.ext(live(T(p.url)), T(p.name) + ' ↗') + '</li>' + (t ? '<li>' + A.ext(live(T(t.url)), u.relatedTool + ': ' + T(t.name) + ' ↗') + '</li>' : '') + '<li>' + A.ext(live(T(p.handbook)), u.relatedHandbook + ' ↗') + '</li></ul>');
  }
  function shortDialog(id) {
    var u = U(), s = S.shorts.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    var v = S.videos.filter(function (x) { return x.no === s.video; })[0], p = A.prod(v.product), lw = u.studioFeatured.replace(/\s*01$/, '');
    A.openDialog('<p class="kicker">Short ' + s.id + ' · ' + u.planned + '</p><h2 class="title" id="dlgTitle">' + T(s.hook) + '</h2><p>' + u.noVideoNote + '</p>' +
      '<p class="kicker">' + u.related + '</p><ul class="links"><li><button class="btn btn--ghost" data-act="video" data-no="' + v.no + '">' + lw + ' ' + v.no + ': ' + T(v.title) + '</button></li><li>' + A.ext(live(T(p.url)), T(p.name) + ' ↗') + '</li></ul>');
  }
  function sampleDialog(pid) {
    var u = U(), p = A.prod(pid);
    var s = S.situations.filter(function (x) { return x.product === p.id; })[0] || S.situations[0];
    A.openDialog('<p class="kicker">' + u.sample + ' · ' + s.doc.code + ' · ' + T(p.name) + '</p><h2 class="title" id="dlgTitle">' + T(s.doc.name) + '</h2><p class="muted">' + T(s.question) + '</p>' + A.sheet(s, false) +
      '<p class="small muted">' + u.exampleNote + '</p><p>' + A.ext(live(T(p.url)), u.toLive + ' ↗') + '</p>');
  }
  function conceptDialog(i) {
    var u = U(), c = S.concepts[i];
    if (!c) return;
    A.openDialog('<p class="kicker">' + u.concept + ' · ' + c.no + '</p><h2 class="title" id="dlgTitle">' + T(c.name) + '</h2><p>' + u.conceptNote + '</p><p class="small muted">' + u.draftNote + '</p>');
  }
  function conceptToolDialog(i) {
    var u = U(), t = S.tools[i];
    if (!t) return;
    A.openDialog('<p class="kicker">' + u.concept + '</p><h2 class="title" id="dlgTitle">' + T(t.name) + '</h2><p>' + u.conceptToolNote + '</p>');
  }

  function swapSituation(i) {
    st.situation = i;
    $$('.pill[data-act="sit"]').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.i) === i)); });
    var w = $('#sitWrap');
    if (!w) return;
    if (!st.motion) { w.innerHTML = A.sitBlock(); return; }
    w.classList.add('swap');
    setTimeout(function () { w.innerHTML = A.sitBlock(); requestAnimationFrame(function () { w.classList.remove('swap'); }); }, 160);
  }

  function act(name, el) {
    var u = U(), i = Number(el.dataset.i);
    switch (name) {
      case 'sit': swapSituation(i); break;
      case 'tab':
        st.tab = i;
        $$('.tab').forEach(function (b, j) { b.setAttribute('aria-selected', String(j === i)); });
        var panel = $('#panel'); if (panel) { panel.innerHTML = A.tabPanel(A.prod(st.product)); panel.setAttribute('aria-labelledby', 'tab' + i); }
        break;
      case 'tool':
        st.tool = i;
        $$('.toolbtn').forEach(function (b, j) { b.setAttribute('aria-pressed', String(j === i)); });
        var work = $('#work'); if (work) work.innerHTML = A.workspace();
        break;
      case 'run':
        var inp = $('#demoIn'), out = $('#demoOut');
        if (inp && out) out.textContent = inp.value.replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, st.lang === 'de' ? '[E-Mail entfernt]' : '[email removed]');
        break;
      case 'concept': conceptDialog(i); break;
      case 'ctool': conceptToolDialog(i); break;
      case 'video': A.closeDialog(); videoDialog(el.dataset.no); break;
      case 'short': shortDialog(el.dataset.id); break;
      case 'sample': sampleDialog(el.dataset.product); break;
      case 'close': A.closeDialog(); break;
      case 'scrollto':
        var target = $('#' + el.dataset.target); if (target) target.scrollIntoView({ behavior: st.motion ? 'smooth' : 'auto', block: 'start' });
        break;
      case 'waitlist':
        st.scrollTo = 'waitlist';
        if (st.page === 'start') { A.render(); } else { location.hash = href('start'); }
        break;
      case 'motion':
        st.motion = !st.motion;
        try { localStorage.setItem('sc-verlag-motion', st.motion ? 'on' : 'off'); } catch (e) { }
        $('#app').classList.toggle('no-motion', !st.motion);
        el.setAttribute('aria-pressed', String(st.motion)); el.textContent = st.motion ? u.motionOn : u.motionOff;
        A.observe();
        break;
      case 'rail':
        var rail = $('#rail'); if (rail) rail.scrollBy({ left: Number(el.dataset.dir) * 420, behavior: st.motion ? 'smooth' : 'auto' });
        break;
      case 'filter':
        st.filter = i;
        $$('.filter').forEach(function (b, j) { b.setAttribute('aria-pressed', String(j === i)); });
        refreshCatalog();
        break;
    }
  }
  function refreshCatalog() {
    var c = $('#catalog'), n = $('#count');
    if (c) { c.innerHTML = A.catalogCards(); A.observe(); }
    if (n) n.textContent = A.countLine();
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a) {
      var dp = a.dataset.product;
      if (dp) { st.product = dp; st.tab = 0; }
      if (a.getAttribute('href') === location.hash) {
        e.preventDefault();
        if (dp) A.render(); else window.scrollTo({ top: 0, behavior: st.motion ? 'smooth' : 'auto' });
      } else if (!location.hash && a.getAttribute('href') === href('start')) {
        e.preventDefault(); window.scrollTo({ top: 0, behavior: st.motion ? 'smooth' : 'auto' });
      }
      return;
    }
    var dlg = $('#dlg');
    if (e.target === dlg) { A.closeDialog(); return; }
    var b = e.target.closest('[data-act]');
    if (b) act(b.dataset.act, b);
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.dataset && e.target.dataset.actInput === 'search') { st.q = e.target.value; refreshCatalog(); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-act-form="waitlist"]');
    if (!f) return;
    e.preventDefault();
    var n = $('#wlNote'); if (n) n.textContent = U().waitlistDraft;
  });
  $('#dlg').addEventListener('close', function () { if (opener && document.contains(opener)) opener.focus(); });
  var opener = null;
  $('#dlg').addEventListener('cancel', function () { });
  var _open = A.openDialog;
  A.openDialog = function (html) { opener = document.activeElement; _open(html); };

  window.addEventListener('hashchange', A.route);
  A.route();
})();
</script>

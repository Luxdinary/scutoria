<title>Scutoria Variante Saphir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;
--ground:#080f20;--surface:#111d34;--raised:#172a49;--ink:#edf3ff;--muted:#a8b9d2;--accent:#4f8cff;--accent-strong:#6a9dff;--accent-tint:rgba(79,140,255,.12);--glass:rgba(79,140,255,.07);--glass-strong:rgba(79,140,255,.12);
--button:#2f6be6;--button-hover:#2a63d9;--button-active:#2459c4;--hairline:rgba(226,232,246,.12);--control:rgba(226,232,246,.34);--silver:#cfd6e3;--edge:rgba(255,255,255,.09);
--paper:#fbfbfd;--paper-ink:#141a24;--paper-muted:#5a6472;--paper-hair:rgba(20,26,36,.12);--paper-accent:#1f5fd1;
--fact:#4f8cff;--interp:#b07cff;--uncertain:#ffd166;--gap:#ff6b6b;--amber:#f2b544;--teal:#2ec4b6;
--cover-a:#11151d;--cover-b:#090b10;--cover-soft:#cfd6e3;--cover-brand:#7aa2ff;
--sans:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
--wrap:1240px;--r-card:20px;--r-field:12px;
--sh-card:0 1px 2px rgba(0,0,0,.3),0 20px 50px rgba(0,0,0,.35);
--sh-paper:0 1px 1px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.24),0 24px 48px rgba(0,0,0,.36);
--sh-lift:0 2px 2px rgba(0,0,0,.22),0 12px 24px rgba(0,0,0,.28),0 40px 72px rgba(0,0,0,.42);
--t-fb:180ms;--t-card:260ms;--t-in:600ms;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
.app{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(70% 34% at 72% -4%,rgba(79,140,255,.16),transparent 72%)}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.display{font-size:clamp(2.5rem,1.9rem + 2.6vw,3.9rem);line-height:1.02;letter-spacing:-.035em}
.title{font-size:clamp(1.75rem,1.5rem + 1vw,2.25rem);line-height:1.1}
.heading{font-size:clamp(1.25rem,1.15rem + .4vw,1.45rem);line-height:1.25;font-weight:700;letter-spacing:-.01em}
.lead{font-size:clamp(1.1rem,1.02rem + .45vw,1.35rem);line-height:1.45;color:var(--muted);max-width:62ch}
.kicker{font:700 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.mono{font-family:var(--mono)}
.small{font-size:.9375rem;line-height:1.5}
.muted{color:var(--muted)}
.measure{max-width:62ch}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-strong);text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
img{max-width:100%;display:block}
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--button);color:#fff;font:600 1rem var(--sans);border:1px solid transparent;cursor:pointer;transition:background var(--t-fb),border-color var(--t-fb);text-decoration:none;text-align:center}
.btn:hover{background:var(--button-hover);color:#fff;text-decoration:none}
.btn:active{background:var(--button-active)}
.btn-ghost{background:transparent;border-color:var(--control);color:var(--ink)}
.btn-ghost:hover{background:var(--accent-tint);color:var(--ink)}
.btn-sm{min-height:40px;padding:0 14px;font-size:.9rem}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}
.link-btn:hover{color:var(--accent-strong)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:3px 10px;border-radius:999px;font:700 11px/1.1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--control);color:var(--muted);white-space:nowrap}
.pill-available{border-color:transparent;background:var(--accent-tint);color:var(--accent)}
.pill-preparing{border-color:transparent;background:rgba(242,181,68,.14);color:var(--amber)}
.pill-production{border-color:transparent;background:rgba(46,196,182,.14);color:var(--teal)}
.chip{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--control);border-radius:999px;padding:8px 10px;color:var(--muted);white-space:nowrap}
.card{background:var(--glass);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:inset 0 1px 0 var(--edge);padding:24px;transition:transform var(--t-card) var(--ease),border-color var(--t-fb);min-width:0}
.card:hover{border-color:rgba(207,214,227,.28)}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:var(--r-field);border:1px solid var(--control);background:rgba(8,15,32,.55);color:var(--ink);font:inherit}
.field::placeholder{color:var(--muted)}
label{display:block;font:600 .9rem var(--sans);margin-bottom:6px}
/* Kopfleiste */
.bar{position:sticky;top:0;z-index:20;background:rgba(8,15,32,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hairline)}
.bar-in{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);min-height:44px}
.brand:hover{text-decoration:none;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--accent)}
.wordmark{font:800 .95rem var(--sans);letter-spacing:.14em}
.nav-toggle{display:none;margin-left:auto;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--control);background:transparent;color:var(--ink);cursor:pointer}
.bar-nav{display:flex;align-items:center;gap:16px;margin-left:auto;flex:1}
.nav-links{display:flex;gap:2px;margin-left:auto}
.nav-links a{color:var(--muted);padding:0 12px;border-radius:999px;min-height:44px;display:inline-flex;align-items:center;font-weight:600}
.nav-links a:hover{color:var(--ink);text-decoration:none}
.nav-links a[aria-current=page]{color:var(--ink);background:var(--accent-tint)}
.bar-tools{display:flex;gap:8px;align-items:center}
.bar-tools .btn-sm{border:1px solid var(--control);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.bar-tools .btn-sm:hover{background:var(--accent-tint)}
@media (max-width:900px){.nav-toggle{display:inline-flex;align-items:center}.bar-nav{display:none;width:100%;flex-direction:column;align-items:stretch;padding-bottom:12px}.bar-nav.open{display:flex}.nav-links{flex-direction:column;margin-left:0}.bar-tools{flex-wrap:wrap}}
/* Hero */
.hero{padding-block:40px 24px}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:center}
.hero-copy{display:grid;gap:20px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pillbtn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--control);background:transparent;color:var(--ink);font:600 .95rem var(--sans);cursor:pointer;transition:background var(--t-fb),border-color var(--t-fb)}
.pillbtn[aria-pressed=true]{background:var(--accent-tint);border-color:var(--accent)}
.sit{display:grid;gap:12px;padding-top:8px;border-top:1px solid var(--hairline)}
.steps{list-style:none;margin:0;padding:0 0 0 16px;display:grid;gap:10px;border-left:1px solid var(--hairline)}
.stepk{display:block;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.steps li p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.steps li:first-child p{color:var(--ink)}
.swap{transition:opacity 240ms var(--ease),transform 240ms var(--ease)}
.swap.is-out{opacity:0;transform:translateY(12px)}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr}}
/* Bühne */
.stage-fig{margin:0;display:grid;gap:8px;min-width:0}
.stage{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3.3;background:#0a1324;border:1px solid var(--edge);box-shadow:var(--sh-card);transition:transform 200ms var(--ease);isolation:isolate}
.stage-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.stage-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,15,32,0) 30%,rgba(8,15,32,.88) 100%)}
.stage-edge{position:absolute;inset:0;border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(207,214,227,.08);pointer-events:none}
.stage-label{position:absolute;left:18px;top:16px;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--silver);background:rgba(8,15,32,.55);border:1px solid rgba(207,214,227,.18);border-radius:999px;padding:7px 11px}
.stage-books{position:absolute;right:5%;bottom:7%;display:flex;gap:14px;align-items:flex-end}
.stage-sheet{position:absolute;left:5%;bottom:7%;width:min(58%,360px)}
.stage-big{position:absolute;right:10%;bottom:9%}
@media (max-width:700px){.stage{aspect-ratio:4/3.9}.stage-books{display:none}.stage-sheet{width:72%;left:6%}.stage-big{right:8%}}
/* Blatt */
.sheet-wrap{position:relative}
.sheet-back{position:absolute;inset:0;transform:translate(14px,10px) rotate(2deg);background:#e9ecf3;border-radius:6px;box-shadow:var(--sh-paper)}
.sheet{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 20px 16px;box-shadow:var(--sh-paper);transform:rotate(2deg);font-size:.875rem;line-height:1.5}
.sheet-wrap.flat .sheet,.sheet-wrap.flat .sheet-back{transform:none}
.sheet-head{display:flex;justify-content:space-between;gap:10px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted);border-bottom:1px solid var(--paper-hair);padding-bottom:8px;margin-bottom:10px}
.sheet-title{font:800 1.05rem/1.2 var(--sans);letter-spacing:-.01em;display:block}
.sheet-biz{color:var(--paper-muted);font-size:.8rem;margin:2px 0 10px}
.sheet-line{margin:0 0 8px;padding-left:12px;border-left:2px solid var(--paper-accent)}
.sheet-src{font:400 11px/1.45 var(--mono);color:var(--paper-muted);border-top:1px solid var(--paper-hair);padding-top:8px;margin-top:10px}
.settle{animation:settle 700ms var(--ease) both}
@keyframes settle{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Buchobjekt */
.book{position:relative;width:var(--bw,150px);aspect-ratio:3/4.3;flex:none;font-size:calc(var(--bw,150px)/12);transform:perspective(800px) rotateY(-12deg);transform-origin:left center;transition:transform var(--t-card) var(--ease)}
.book-face{position:absolute;inset:0;border-radius:3px 9px 9px 3px;background:linear-gradient(180deg,var(--cover-a),var(--cover-b));border:1px solid rgba(207,214,227,.2);border-left:4px solid rgba(207,214,227,.12);box-shadow:var(--sh-card),inset 1px 0 0 rgba(255,255,255,.08);display:flex;flex-direction:column;padding:11% 9% 9% 12%;color:#fff;overflow:hidden}
.book-pages{position:absolute;right:-5px;top:5px;bottom:5px;width:5px;background:var(--silver);opacity:.7;border-radius:0 2px 2px 0}
.book-stripe{display:block;height:.35em;width:40%;background:var(--line);border-radius:2px;margin-bottom:9%}
.book-no{font:500 .72em var(--mono);letter-spacing:.1em;color:var(--cover-brand);text-transform:uppercase}
.book-title{display:block;font:800 1.15em/1.15 var(--sans);letter-spacing:-.01em;margin:6% 0 auto}
.book-series{font:400 .62em var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cover-soft)}
.book-cpill{position:absolute;right:8%;top:8%;font:700 .6em var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--control);border-radius:999px;padding:.3em .6em;color:var(--muted)}
.book.is-concept .book-face{background:rgba(8,15,32,.35);border:1px dashed rgba(207,214,227,.4);border-left-width:4px;box-shadow:none;color:var(--muted)}
.book.is-concept .book-pages{opacity:.25}
.book.is-concept .book-stripe{opacity:.45}
.book.is-concept .book-no{color:var(--muted)}
a:hover .book,a:focus-visible .book,button:hover .book,button:focus-visible .book,.lift:hover .book{transform:perspective(800px) rotateY(-12deg) translateY(-8px)}
/* Abschnitte */
.section{padding-block:72px}
.section+.section{border-top:1px solid var(--hairline)}
@media (min-width:900px){.section{padding-block:96px}}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.section-head>div{display:grid;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:900px){.grid-3{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}
.path{cursor:pointer;text-align:left;color:var(--ink);display:grid;gap:8px;align-content:start}
.path[aria-pressed=true]{border-color:var(--accent);background:var(--glass-strong)}
.path-ico{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--accent-tint);color:var(--accent);margin-bottom:6px}
.path-feedback{margin-top:20px;padding:14px 18px;border-left:2px solid var(--accent);color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.products{display:grid;gap:24px}
.product{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:center}
.product-cover{display:flex;justify-content:center;align-items:center;padding:30px 10px;background:rgba(8,15,32,.55);border-radius:16px;border:1px solid var(--hairline);min-height:100%}
.product-cover:hover{text-decoration:none}
.product-body{display:grid;gap:14px;min-width:0}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font:400 .85rem var(--mono);color:var(--muted)}
.facts li::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:8px;vertical-align:middle}
.price-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price{font:500 2rem/1 var(--mono);letter-spacing:-.02em}
.prep-in{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.prep-in>div{display:grid;gap:10px;justify-items:start}
@media (max-width:700px){.product{grid-template-columns:1fr}.prep-in{grid-template-columns:1fr}}
.how{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;padding-top:28px}
.how-line{position:absolute;left:0;right:0;top:0;height:2px;background:var(--hairline);overflow:hidden}
.how-line::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(var(--fill,0));transform-origin:left;transition:transform 200ms linear}
.how-step{display:grid;gap:8px;align-content:start}
.how-step .num{font:500 12px var(--mono);color:var(--accent);letter-spacing:.14em}
@media (max-width:800px){.how{grid-template-columns:1fr;padding-top:0;padding-left:24px}.how-line{right:auto;width:2px;height:100%}.how-line::after{transform:scaleY(var(--fill,0));transform-origin:top}}
.markers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.marker{display:grid;gap:10px;align-content:start}
.marker svg{width:56px;height:56px}
.mk-stroke{stroke-dasharray:80;stroke-dashoffset:80;transition:stroke-dashoffset 500ms var(--ease)}
.drawn .mk-stroke{stroke-dashoffset:0}
.mk-fill{opacity:0;transition:opacity 300ms 300ms}
.drawn .mk-fill{opacity:1}
.mk-pop{opacity:0;transform:scale(.6);transform-origin:center;transition:opacity 500ms var(--ease),transform 500ms var(--ease)}
.drawn .mk-pop{opacity:1;transform:none}
.mk-row{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.mk-row span{display:inline-flex;align-items:center;gap:8px;font:500 .85rem var(--mono);color:var(--muted)}
.mk-row svg{width:18px;height:18px}
@media (max-width:900px){.markers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.before-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.before-card>div{display:grid;gap:8px;justify-items:start}
.tool-card{display:grid;gap:8px;align-content:start;justify-items:start}
.studio-teaser{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:stretch}
.studio-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.studio-teaser{grid-template-columns:1fr}}
.wait-form{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:16px}
.wait-form>div{flex:1 1 260px}
/* Poster */
.poster{position:relative;display:grid;align-content:end;gap:8px;padding:20px;aspect-ratio:16/9;width:100%;border-radius:16px;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--sh-card);color:var(--ink);text-align:left;cursor:pointer;overflow:hidden;transition:transform var(--t-card) var(--ease),border-color var(--t-fb);min-width:0}
.poster::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.poster-bg{position:absolute;right:12px;top:-6px;font:800 7rem/1 var(--sans);letter-spacing:-.06em;color:rgba(237,243,255,.06);pointer-events:none}
.poster:hover,.poster:focus-visible{transform:translateY(-8px);border-color:rgba(207,214,227,.3)}
.poster-no{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative}
.poster-title{font:800 clamp(1.05rem,.95rem + .6vw,1.5rem)/1.15 var(--sans);letter-spacing:-.02em;position:relative}
.poster-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative}
.poster.v{aspect-ratio:9/16;padding:16px}
.poster.v .poster-title{font-size:1rem}
.poster.v .poster-bg{font-size:4rem}
.studio-feature{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;margin-bottom:56px}
.feature-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.studio-feature{grid-template-columns:1fr}}
.row-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.row-arrows{display:flex;gap:8px}
.row-arrows button{min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--control);background:transparent;color:var(--ink);cursor:pointer}
.row-arrows button:hover{background:var(--accent-tint)}
.shorts-row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 18px;scrollbar-width:thin;scrollbar-color:var(--control) transparent}
.shorts-row>*{flex:0 0 190px;scroll-snap-align:start}
.programme{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.prog-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;padding:18px 20px;border:1px solid var(--hairline);border-left:4px solid var(--line);border-radius:14px;background:var(--glass)}
.prog-row .num{font:500 1.4rem/1 var(--mono);color:var(--muted);padding-top:4px}
.prog-row>div{display:grid;gap:8px;min-width:0}
.related{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;align-items:center}
.related .k{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* Bibliothek */
.page-head{padding-block:40px 32px;display:grid;gap:14px}
.lib-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start;padding-bottom:80px}
.lib-rail{position:sticky;top:84px;display:grid;gap:16px}
.rail-filters{display:grid;gap:4px}
.rail-filters button{text-align:left;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 1rem var(--sans);cursor:pointer}
.rail-filters button:hover{color:var(--ink)}
.rail-filters button[aria-pressed=true]{background:var(--accent-tint);color:var(--ink);border-color:var(--hairline)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card-hit{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;cursor:pointer;font:inherit}
.card-hit:hover{text-decoration:none;color:inherit}
.cover-stage{display:flex;justify-content:center;padding:30px 10px 22px;background:rgba(8,15,32,.55);border-radius:14px;border:1px solid var(--hairline)}
.card-meta{display:grid;gap:8px;padding-top:16px;justify-items:start}
.card-meta h3{font-size:1.1rem;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.card.is-concept{background:transparent;border-style:dashed}

/* Bibliothek */
function libItems() {
  const q = state.search.trim().toLowerCase(), f = t().filters[state.filter];
  const topicOf = (it) => ({ KI: t().filters[1], Sicherheit: t().filters[2], Praxis: t().filters[3] })[it.topic];
  const all = S.products.concat(S.concepts);
  return all.filter(it => (state.filter === 0 || topicOf(it) === f) && (!q || L(it.name).toLowerCase().includes(q)));
}
function libCards() {
  const u = t(), items = libItems();
  const topicLabel = (it) => ({ KI: u.filters[1], Sicherheit: u.filters[2], Praxis: u.filters[3] })[it.topic];
  if (!items.length) return `<p class="muted">${state.lang === "de" ? "Kein passender Titel." : "No matching title."}</p>`;
  return items.map((it, i) => {
    const isC = !it.status;
    const inner = `<div class="cover-stage">${book(it, { bw: 128 })}</div><div class="card-meta">${isC ? pill("concept", topicLabel(it)) : pill(it.status, topicLabel(it))}<h3>${L(it.name)}</h3><p class="muted small">${isC ? u.conceptNote : (it.status === "available" ? L(it.questions) + " · " + u.documents + " · " + it.formats : L(it.short))}</p></div>`;
    return `<article class="card book-card${isC ? " is-concept" : ""} reveal" style="--i:${i % 3}">${isC ? `<button type="button" class="card-hit" onclick="A.openConcept('${it.no}')">${inner}</button>` : `<a class="card-hit" href="${hashFor("product")}" onclick="A.setProduct('${it.id}')">${inner}</a>`}</article>`;
  }).join("");
}
function pageLibrary() {
  const u = t();
  return `<section class="wrap page-head"><p class="kicker">${x().libK}</p><h1 class="display">${u.libraryTitle}</h1><p class="lead">${u.libraryIntro}</p></section><section class="wrap lib-grid"><aside class="lib-rail"><div><label for="libSearch">${u.search}</label><input class="field" id="libSearch" type="search" value="${state.search}" oninput="A.setSearch(this.value)"></div><p class="kicker">${x().topic}</p><div class="rail-filters">${u.filters.map((f, i) => `<button type="button" aria-pressed="${state.filter === i}" onclick="A.setFilter(${i})">${f}</button>`).join("")}</div><p class="small muted">${u.countLine}</p></aside><div class="lib-main"><p class="mono small muted" id="libCount" aria-live="polite" style="margin-bottom:16px">${libItems().length} ${u.entries}</p><div class="cards" id="libCards">${libCards()}</div></div></section>`;
}

/* Produktseite */
function tabPanel(p) {
  const u = t(), i = state.tab;
  if (i === 0) return `<p class="lead">${L(p.short)}</p><ul class="facts"><li>${L(p.questions)}</li><li>${u.documents}</li><li>${p.formats}</li></ul><p class="muted measure">${L(p.lead)}</p>`;
  if (i === 1) return `<p class="kicker">${u.whatYouGet}</p><ol>${L(p.docs).map((d, k) => `<li><span class="mono">${k < 7 ? "D" + (k + 1) : "HB"}</span><span>${d}</span></li>`).join("")}</ol>`;
  if (i === 2) return `<div class="how" style="padding-top:0">${S.how.map((h, k) => `<div class="how-step"><span class="num">0${k + 1}</span><h3 class="heading">${L(h.title)}</h3><p class="muted">${L(h.text)}</p></div>`).join("")}</div>`;
  return `<p class="muted measure">${L(p.limits)}</p><h3 class="heading">${u.isNot}</h3><p class="muted measure">${u.isNotText}</p>`;
}
function pageProduct() {
  const u = t(), p = prod();
  const other = S.products.find(z => z.status === "available" && z.id !== p.id);
  const statusKey = p.status;
  const head = `<section class="wrap prod-hero"><div class="prod-copy"><p class="kicker">Scutoria · ${p.no} · ${u[statusKey === "available" ? "available" : "preparing"]}</p><h1 class="display reveal">${L(p.name)}</h1><p class="lead reveal" style="--i:1">${L(p.lead)}</p>${statusKey === "available" ? `<div class="actions reveal" style="--i:2"><button class="btn" type="button" onclick="A.openSample('${p.id}')">${u.sample}</button><a class="btn btn-ghost" href="${live(L(p.url))}"${EXT}>${u.toLive} ↗</a><a href="${live(L(p.handbook))}"${EXT}>${u.handbook} ↗</a></div><p class="facts mono small"><span>${L(p.questions)}</span> · <span>${u.documents}</span> · <span>${p.formats}</span></p>` : `<div class="actions">${pill("preparing")}<a class="btn btn-ghost" href="${hashFor("start")}" onclick="A.scrollTo('waitlist');return false">${u.waitlistTitle}</a></div>`}${other ? `<p><button class="link-btn" type="button" onclick="A.setProduct('${other.id}',true)">${u.switchProduct}: ${L(other.name)} →</button></p>` : ""}</div>${stage({ big: p, sheet: false, books: false, lazy: true })}</section>`;
  if (statusKey !== "available") return head + waitlist();
  const body = `<section class="wrap prod-body"><div><div class="tabs" role="tablist" aria-label="${L(p.name)}">${u.productTabs.map((tb, i) => `<button type="button" role="tab" id="tab${i}" aria-selected="${state.tab === i}" aria-controls="tabpanel" onclick="A.setTab(${i})">${tb}</button>`).join("")}</div><div class="tabpanel" id="tabpanel" role="tabpanel" aria-labelledby="tab${state.tab}">${tabPanel(p)}</div><div style="margin-top:32px">${markerRow()}</div></div><aside class="card price-card"><p class="kicker">${u.price}</p><p class="price-big">${price(p.price.founder)}</p><p>${u.founder}, ${u.regular}</p><p class="small muted">${u.licence}</p><a class="btn" href="${live(L(p.url))}"${EXT}>${u.buy} ↗</a><p class="small muted">${u.buyNote}</p></aside></section>`;
  return head + body;
}

/* Routing, Rendern, Verhalten */
const PAGES = { start: pageStart, library: pageLibrary, product: pageProduct, tools: pageTools, studio: pageStudio };
function parseHash() {
  const m = (location.hash || "").slice(1).match(/^(de|en)-([a-z]+)$/);
  if (!m) return { lang: "de", page: "start" };
  const page = Object.keys(SLUG[m[1]]).find(k => SLUG[m[1]][k] === m[2]) || "start";
  return { lang: m[1], page };
}
function render() {
  const u = t();
  document.documentElement.lang = state.lang;
  $("#app").setAttribute("lang", state.lang);
  $("#hdr").innerHTML = header();
  $("#main").innerHTML = PAGES[state.page]();
  $("#foot").innerHTML = footer();
  const names = { start: u.start, library: u.library, product: L(prod().name), tools: u.tools, studio: u.studio };
  document.title = "Scutoria · " + names[state.page];

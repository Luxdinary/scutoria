<title>Scutoria Variante Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;
--ground:#080b17;--surface:#0f1527;--raised:#16203a;--ink:#eef4ff;--muted:#9fb0cc;
--accent:#346fef;--accent-strong:#6a9dff;--button:#2f6be6;--button-hover:#2a63d9;--button-active:#2459c4;
--hairline:rgba(226,232,246,.12);--control:rgba(226,232,246,.34);--edge:rgba(226,232,246,.16);--tint:rgba(52,111,239,.14);--glass:rgba(79,140,255,.08);
--paper:#fbfbfd;--paper-back:#e6e9f0;--paper-ink:#141a24;--paper-muted:#5a6472;--paper-line:rgba(20,26,36,.12);
--fact:#4f8cff;--interp:#b07cff;--uncertain:#ffd166;--gap:#ff6b6b;--green:#2ec4b6;--amber:#ffd166;
--line-policy:#4f8cff;--line-security:#2ec4b6;--line-setup:#f2b544;--line-foundations:#cfd6e3;
--cover-a:#11151d;--cover-b:#090b10;--cover-soft:#cfd6e3;--cover-brand:#7aa2ff;--pages:#e9e6df;
--focus:#4f8cff;--scrim:rgba(8,11,23,.82);
--sans:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
--w:1240px;
--shadow-card:0 1px 2px rgba(0,0,0,.3),0 20px 50px rgba(0,0,0,.35);
--shadow-paper:0 1px 1px rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.24),0 24px 48px rgba(0,0,0,.36);
--t-fast:180ms;--t-card:280ms;--t-enter:600ms;--ease:cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--accent-strong)}
p,h1,h2,h3,ul,ol{margin:0}
h1,h2,h3{text-wrap:balance;hyphens:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.display{font-family:var(--sans);font-weight:800;font-size:clamp(2.6rem,1.6rem + 3.4vw,4.75rem);line-height:1.02;letter-spacing:-.035em}
.display-s{font-size:clamp(2.2rem,1.5rem + 2.4vw,3.6rem)}
.title{font-family:var(--sans);font-weight:800;font-size:clamp(1.75rem,1.5rem + 1vw,2.25rem);line-height:1.1;letter-spacing:-.02em}
.heading{font-family:var(--sans);font-weight:700;font-size:clamp(1.3rem,1.2rem+.4vw,1.5rem);line-height:1.25;letter-spacing:-.01em}
.lead{font-size:clamp(1.125rem,1rem+.5vw,1.375rem);line-height:1.45;max-width:38ch;margin-top:18px}
.kicker{font-family:var(--mono);font-weight:700;font-size:12px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.small{font-size:15px;line-height:1.5}
.muted{color:var(--muted)}
.note{margin-top:18px;max-width:62ch}
.wrap{max-width:var(--w);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.section{padding-block:72px;position:relative}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.sec-head h2{margin-top:10px}
.sec-head .muted{margin-top:12px;max-width:62ch}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}
.btn,.btn-ghost,.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-family:var(--sans);font-weight:700;font-size:15px;line-height:1;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
.btn{background:var(--button);color:#fff}.btn:hover{background:var(--button-hover)}.btn:active{background:var(--button-active)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--control)}.btn-ghost:hover{border-color:var(--ink)}
.btn-ghost.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn-text{background:none;border:0;padding:0 4px;min-height:44px;display:inline-flex;align-items:center;gap:8px;color:var(--accent-strong);font-family:var(--sans);font-weight:700;font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.tbtn{min-height:40px;padding:0 14px;font-size:14px;border-color:var(--control);color:var(--ink);background:transparent}
.chip{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:700;font-size:11px;line-height:1;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid var(--control);color:var(--muted)}
.chips{display:inline-flex;gap:6px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:11px;line-height:1;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pill-ok{background:rgba(46,196,182,.16);color:#8fe6dc}
.pill-prep{background:rgba(242,181,68,.16);color:#ffd98a}
.pill-concept{border:1px dashed var(--control);color:var(--muted)}
.pill-prod{background:rgba(52,111,239,.2);color:#a9c4ff}
.pill-plan{border:1px solid var(--hairline);color:var(--muted)}
.pill-kind{background:var(--tint);color:#a9c4ff}
.top{position:sticky;top:0;z-index:20;background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline)}
.top-in{display:flex;align-items:center;gap:16px 24px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-height:44px}
.mark{width:28px;height:28px;color:var(--accent-strong);flex:none}
.word{font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:.14em}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;transition:color var(--t-fast),background var(--t-fast)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);background:var(--tint)}
.top-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero{position:relative;background:var(--ground)}
.hero-media{position:relative;height:clamp(640px,74vh,900px)}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,11,23,.95) 0,rgba(8,11,23,.84) 34%,rgba(8,11,23,.34) 64%,rgba(8,11,23,.08) 100%),linear-gradient(180deg,rgba(8,11,23,0) 56%,var(--ground) 100%)}
.caption{position:absolute;right:16px;bottom:10px;font-family:var(--mono);font-size:11px;line-height:1.2;color:rgba(238,244,255,.55);margin:0}
.hero-content{position:absolute;inset:0}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;height:100%;align-items:end;padding-bottom:44px}
.hero-copy{align-self:center;max-width:600px;padding-top:40px}
.hero-copy .display{margin-top:16px}
.forwhom{margin-top:18px}
.claim{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-top:22px}
.hero-stage{width:min(100%,520px);justify-self:end;background:rgba(8,11,23,.58);border:1px solid var(--edge);border-radius:20px;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stage-k{margin-bottom:10px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pills button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--control);background:rgba(15,21,39,.75);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast)}
.pills button:hover{border-color:var(--ink)}
.pills button[aria-pressed=true]{background:var(--button);border-color:var(--button);color:#fff}
.q{margin-bottom:16px}
.q-text{font-weight:600;font-size:18px;line-height:1.4;letter-spacing:-.01em;margin-top:6px}
.sheet-wrap{position:relative;margin-top:6px}
.sheet-wrap::before{content:"";position:absolute;inset:0;background:var(--paper-back);border-radius:6px;transform:rotate(-1.5deg) translate(14px,10px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.sheet{position:relative;z-index:1;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:20px 22px 16px;box-shadow:var(--shadow-paper);transform:rotate(-1.5deg)}
.sheet.settle{animation:settle 700ms var(--ease) both}
.sheet-wrap.swap .sheet-in{animation:swap 240ms var(--ease) both}
.sheet-wrap.flat::before{display:none}
.sheet-wrap.flat .sheet{transform:none}
.sheet-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;line-height:1.3;letter-spacing:.06em;color:var(--paper-muted)}
.sheet-title{font-family:var(--sans);font-weight:800;font-size:20px;line-height:1.2;letter-spacing:-.01em;margin-top:10px;hyphens:manual}
.sheet-line{font-size:15px;line-height:1.5;margin-top:10px;padding:2px 0 2px 12px;border-left:3px solid var(--line,var(--accent));border-radius:0 4px 4px 0;transition:background 200ms}
.sheet-line.hl{background:rgba(79,140,255,.14)}
.sheet-src{font-family:var(--mono);font-size:11px;line-height:1.4;color:var(--paper-muted);margin-top:14px;padding-top:10px;border-top:1px solid var(--paper-line)}
.sheet-note{margin-top:12px}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:16px}
.step{font-family:var(--mono);font-weight:500;font-size:12px;line-height:1;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-radius:999px;border:1px solid var(--hairline);transition:color var(--t-fast),border-color var(--t-fast)}
.step.on{color:var(--ink);border-color:var(--accent)}
.steps .btn-text{margin-left:auto}
.beat{animation:enter var(--t-enter) var(--ease) both}
.beat-2{animation-delay:120ms}.beat-3{animation-delay:240ms}
.enter{animation:enter var(--t-enter) var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes settle{from{opacity:0;transform:translateY(16px) rotate(0)}to{opacity:1;transform:rotate(-1.5deg)}}
.band::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 18% 0,rgba(52,111,239,.16),transparent 70%);pointer-events:none}
.band>.wrap{position:relative}
.studio-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;margin-bottom:36px;align-items:stretch}
.shorts-pair{display:grid;grid-template-columns:200px 200px;gap:16px}
.short-tall{width:200px;height:100%;aspect-ratio:auto}
.poster{position:relative;display:flex;flex-direction:column;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:22px 24px;text-align:left;color:var(--ink);cursor:pointer;overflow:hidden;transition:transform var(--t-card) var(--ease),border-color var(--t-fast)}
.poster::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line,var(--accent))}
.poster:hover,.poster:focus-visible{transform:translateY(-8px);border-color:var(--control)}
.poster-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.poster-ttl{font-family:var(--sans);font-weight:800;font-size:18px;line-height:1.2;letter-spacing:-.02em;margin-top:18px;max-width:22ch}
.poster-big .poster-ttl{font-size:clamp(22px,2.4vw,36px);max-width:20ch}
.poster-foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.poster-num{position:absolute;right:18px;bottom:4px;font-family:var(--mono);font-weight:500;font-size:clamp(48px,7vw,110px);line-height:1;color:rgba(238,244,255,.1);pointer-events:none}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.arrows{display:flex;gap:8px;align-items:center}
.arrows .hint{margin-right:6px}
.arrows button{width:44px;height:44px;border-radius:999px;border:1px solid var(--control);background:transparent;color:var(--ink);font-size:22px;line-height:1;cursor:pointer;transition:border-color var(--t-fast)}
.arrows button:hover{border-color:var(--ink)}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 16px;scrollbar-width:thin;scroll-behavior:smooth}
.no-motion .row{scroll-behavior:auto}
.row>*{scroll-snap-align:start;flex:0 0 auto}
.short{position:relative;display:flex;flex-direction:column;width:190px;aspect-ratio:9/16;background:var(--surface);border:1px solid var(--edge);border-radius:16px;padding:16px 14px;color:var(--ink);text-align:left;cursor:pointer;overflow:hidden;transition:transform var(--t-card) var(--ease),border-color var(--t-fast)}
.short::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--line,var(--accent))}
.short:hover,.short:focus-visible{transform:translateY(-8px);border-color:var(--control)}
.short .id{font-family:var(--mono);font-weight:500;font-size:11px;line-height:1;letter-spacing:.08em;color:var(--muted)}
.short .hook{font-family:var(--sans);font-weight:700;font-size:16px;line-height:1.3;letter-spacing:-.01em;margin-top:14px}
.short .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.short .ratio{font-family:var(--mono);font-size:10px;line-height:1;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:20px;min-height:220px;transition:transform var(--t-card) var(--ease),border-color var(--t-fast)}
.tile:hover{transform:translateY(-4px);border-color:var(--control)}
.tile .ico{width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;color:var(--accent-strong)}
.tile.concept{border-style:dashed}
.tile.concept .ico{background:transparent;border:1px dashed var(--control);color:var(--muted)}
.tile.concept h3{color:var(--muted)}
.tile-k{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile h3{font-family:var(--sans);font-weight:700;font-size:17px;line-height:1.3}
.tile p{font-size:14px;color:var(--muted);line-height:1.5}
.tile .act{margin-top:auto;padding-top:8px}
.cover-card{display:flex;flex-direction:column;gap:12px;width:200px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;align-items:flex-start}
.cover-card .cover{transition:transform var(--t-card) var(--ease)}
.cover-card:hover .cover,.cover-card:focus-visible .cover{transform:translateY(-8px)}
.cover-card .nm{font-family:var(--sans);font-weight:700;font-size:15px;line-height:1.3}
.cover{position:relative;width:100%;aspect-ratio:3/4;border-radius:4px 10px 10px 4px;background:linear-gradient(180deg,var(--cover-a),var(--cover-b));box-shadow:var(--shadow-card);padding:14px 14px 12px 20px;display:flex;flex-direction:column;color:#fff;border:1px solid rgba(226,232,246,.1)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.1);border-radius:4px 0 0 4px}
.cover::after{content:"";position:absolute;right:-5px;top:5px;bottom:5px;width:5px;background:var(--pages);border-radius:0 3px 3px 0}
.cover .stripe{display:block;height:6px;border-radius:3px;background:var(--line,var(--accent))}
.cover .no{font-family:var(--mono);font-weight:500;font-size:11px;line-height:1.2;letter-spacing:.08em;color:var(--cover-brand);margin-top:12px}
.cover .cov-pill{margin-top:8px;align-self:flex-start}
.cover .ttl{font-family:var(--sans);font-weight:800;font-size:clamp(15px,1.3vw,19px);line-height:1.15;letter-spacing:-.01em;margin-top:auto;overflow-wrap:anywhere}
.cover .ser{font-family:var(--mono);font-weight:500;font-size:10px;line-height:1.3;letter-spacing:.08em;color:var(--cover-soft);margin-top:8px}
.cover.concept{background:transparent;border:1px dashed var(--control);box-shadow:none;color:var(--muted)}
.cover.concept::before,.cover.concept::after{display:none}
.cover.concept .stripe{opacity:.45}
.cover.concept .no{color:var(--muted)}
.kits{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kit{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:24px;background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:28px;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.kit .obj{padding:18px;background:var(--glass);border-radius:16px;border:1px solid var(--edge)}
.kit .obj .cover-card{width:100%}
.kit h3{margin-top:10px}
.kit .muted{margin-top:10px}
.facts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px;font-size:15px;color:var(--muted)}
.facts li::before{content:"";display:inline-block;width:8px;height:8px;background:var(--line,var(--accent));margin-right:10px;vertical-align:middle;border-radius:2px}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:18px}
.price .amount{font-family:var(--mono);font-weight:500;font-size:32px;line-height:1}
.kit-prep{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--control);border-radius:20px;padding:22px 28px;margin-top:20px}
.kit-prep h3{margin-top:8px}
.kit-prep .muted{margin-top:6px;max-width:62ch}
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.path{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:22px;color:var(--ink);text-decoration:none;transition:transform var(--t-card) var(--ease),border-color var(--t-fast)}
.path:hover{transform:translateY(-4px);border-color:var(--control)}
.path .shape{width:28px;height:28px;color:var(--accent-strong);flex:none;margin-top:2px}
.path .shape svg{width:100%;height:100%}
.path-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.path-t strong{font-size:17px}
.path .arrow{margin-left:auto;color:var(--muted);font-size:20px}
.how-rule{position:relative;height:2px;background:var(--hairline);margin:0 0 28px;overflow:hidden;border-radius:2px}
.how-fill{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform 120ms linear}
.no-motion .how-fill{transform:scaleX(1)}
.how-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.how-step .num{font-family:var(--mono);font-weight:500;font-size:12px;line-height:1;letter-spacing:.1em;color:var(--accent-strong)}
.how-step h3{margin-top:10px}
.how-step .muted{margin-top:10px}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px}
.why-i{border-top:1px solid var(--hairline);padding-top:18px}
.why-i .muted{margin-top:10px}
.markers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.marker{background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:22px}
.marker .shape{display:block;width:40px;height:40px;opacity:0;transform:scale(.6);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.marker .shape svg{width:100%;height:100%}
.marker:nth-child(2) .shape{transition-delay:80ms}.marker:nth-child(3) .shape{transition-delay:160ms}.marker:nth-child(4) .shape{transition-delay:240ms}
.drawn .marker .shape{opacity:1;transform:none}
.no-motion .marker .shape{opacity:1;transform:none}
.marker h3{margin-top:16px}
.marker .muted{margin-top:8px}
.m-fact{color:var(--fact)}.m-interpretation{color:var(--interp)}.m-uncertain{color:var(--uncertain)}.m-gap{color:var(--gap)}
.marker-bar{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--hairline)}
.mk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.mk .shape{width:18px;height:18px;display:inline-block}

 return '<section class="section band"><div class="wrap"><p class="kicker">'+esc(x.studio)+' · YouTube · Reels</p><h1 class="display" tabindex="-1">'+esc(u.studioTitle)+'</h1><p class="lead muted">'+esc(u.studioIntro)+'</p><div class="lib-tools"><div class="filters" role="group" aria-label="'+esc(x.topic)+'"><span class="mono small muted">'+esc(x.topic)+'</span>'+topics.map(k=>'<button type="button" data-act="stopic" data-k="'+k[0]+'" aria-pressed="'+(state.sTopic===k[0])+'">'+esc(k[1])+'</button>').join('')+'</div><div class="filters" role="group" aria-label="'+esc(x.format)+'"><span class="mono small muted">'+esc(x.format)+'</span>'+formats.map(k=>'<button type="button" data-act="sformat" data-k="'+k[0]+'" aria-pressed="'+(state.sFormat===k[0])+'">'+esc(k[1])+'</button>').join('')+'</div></div><div id="studioBody">'+studioBody()+'</div></div></section>';}
function headerHTML(){const u=ui(),L=state.lang,other=L==='de'?'en':'de';const cur=state.page==='product'?'library':state.page;return '<div class="wrap top-in"><a class="brand" href="'+hashFor(L,'start')+'" aria-label="Scutoria">'+MARK+'<span class="word">SCUTORIA</span></a><nav class="nav" aria-label="Scutoria">'+['start','library','tools','studio'].map(p=>'<a href="'+hashFor(L,p)+'"'+(cur===p?' aria-current="page"':'')+'>'+esc(u[p])+'</a>').join('')+'<a href="'+live(L==='de'?'/de/konto':'/account')+'" target="_blank" rel="noopener">'+esc(u.account)+' ↗</a></nav><div class="top-tools"><span class="chip">'+esc(u.draft)+'</span><button type="button" class="tbtn" data-act="motion" aria-pressed="'+state.motion+'">'+esc(state.motion?u.motionOn:u.motionOff)+'</button><a class="tbtn" href="'+hashFor(other,state.page)+'" lang="'+other+'">'+esc(u.language)+'</a></div></div>';}
function footerHTML(){const u=ui(),L=state.lang,x=xx();return '<div class="wrap foot-in"><div><a class="brand" href="'+hashFor(L,'start')+'">'+MARK+'<span class="word">SCUTORIA</span></a><p class="mono muted claim2">'+esc(t(SC.claim))+'</p><p class="small muted foot-legal">'+esc(u.noLegal)+'</p></div><div><ul>'+u.legal.map(l=>'<li><a href="'+live(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a></li>').join('')+'</ul><p class="small muted draft">'+esc(u.draftNote)+'</p><p class="mono small muted">'+esc(x.stand)+': '+esc(t(SC.meta.stand))+'</p></div></div>';}
function dlgVideo(no){const u=ui(),L=state.lang,x=xx();const v=SC.videos.find(v=>v.no===no);const p=SC.products.find(p=>p.id===v.product);const tool=v.tool?SC.tools.find(tt=>tt.id===v.tool):null;return '<p class="kicker">'+esc(x.long)+' '+v.no+' · DE · EN</p><h2 id="dlgTitle">'+esc(t(v.title))+'</h2><p>'+pill(v.status)+' <span class="pill pill-plan">'+esc(u.previewSoon)+'</span></p><p class="muted small note">'+esc(u.noVideoNote)+'</p><p class="kicker rel-k">'+esc(u.related)+'</p><ul class="rel-list"><li><a href="'+live(p.url[L])+'" target="_blank" rel="noopener">'+esc(t(p.name))+' ↗</a></li>'+(tool?'<li><a href="'+live(tool.url[L])+'" target="_blank" rel="noopener">'+esc(u.relatedTool)+': '+esc(t(tool.name))+' ↗</a></li>':'')+'<li><a href="'+live(p.handbook[L])+'" target="_blank" rel="noopener">'+esc(u.relatedHandbook)+' ↗</a></li></ul>';}
function dlgShort(id){const u=ui(),L=state.lang,x=xx();const s=SC.shorts.find(s=>s.id===id);const v=SC.videos.find(v=>v.no===s.video);const p=SC.products.find(p=>p.id===v.product);return '<p class="kicker">'+esc(x.short)+' '+s.id+' · 9:16 · DE · EN</p><h2 id="dlgTitle">'+esc(t(s.hook))+'</h2><p>'+pill('planned')+'</p><p class="muted small note">'+esc(u.noVideoNote)+'</p><p class="kicker rel-k">'+esc(u.related)+'</p><ul class="rel-list"><li><button type="button" class="btn-text" data-act="video" data-no="'+v.no+'">'+esc(x.long)+' '+v.no+': '+esc(t(v.title))+'</button></li><li><a href="'+live(p.url[L])+'" target="_blank" rel="noopener">'+esc(t(p.name))+' ↗</a></li></ul>';}
function dlgSample(pid){const u=ui(),L=state.lang,x=xx();const p=SC.products.find(p=>p.id===pid)||SC.products[0];const sit=SC.situations.find(s=>s.product===p.id)||SC.situations[0];return '<p class="kicker">'+esc(x.sampleOf)+' '+esc(t(p.name))+'</p><h2 id="dlgTitle">'+esc(t(sit.question))+'</h2>'+sheet(sit,'flat')+'<div class="actions"><a class="btn-ghost" href="'+live(p.handbook[L])+'" target="_blank" rel="noopener">'+esc(u.handbook)+' ↗</a><a class="btn-text" href="'+live(p.url[L])+'" target="_blank" rel="noopener">'+esc(u.toLive)+' ↗</a></div>';}
function dlgConcept(no){const u=ui();const c=SC.concepts.find(c=>c.no===no);return '<p class="kicker">'+esc(u.concept)+' · '+c.no+'</p><h2 id="dlgTitle">'+esc(t(c.name))+'</h2><p>'+esc(u.conceptNote)+'</p>';}
function dlgConceptTool(id){const u=ui();const tl=SC.tools.find(tt=>tt.id===id);return '<p class="kicker">'+esc(u.concept)+'</p><h2 id="dlgTitle">'+esc(t(tl.name))+'</h2><p>'+esc(u.conceptToolNote)+'</p>';}
function dlgPrep(id){const u=ui(),x=xx();const p=SC.products.find(p=>p.id===id);return '<p class="kicker">'+esc(x.toolkit)+' '+p.no+' · '+esc(u.preparing)+'</p><h2 id="dlgTitle">'+esc(t(p.name))+'</h2><p>'+esc(t(p.lead))+'</p>';}
const views={start:viewStart,library:viewLibrary,product:viewProduct,tools:viewTools,studio:viewStudio};
global.__SCV__={views,state,headerHTML,footerHTML,dialogs:{dlgVideo,dlgShort,dlgSample,dlgConcept,dlgConceptTool,dlgPrep},PAGES};
if(typeof document==='undefined')return;
const $=(s,r)=>(r||document).querySelector(s);
const app=$('#app'),hdr=$('#hdr'),main=$('#main'),foot=$('#foot'),dlg=$('#dlg');
let returnFocus=null,io=null,navigated=false;
function parseHash(){const m=/^#(de|en)-([a-z]+)$/.exec(location.hash||'');if(!m)return null;const lang=m[1];const page=Object.keys(PAGES[lang]).find(k=>PAGES[lang][k]===m[2]);return page?{lang,page}:null;}
function route(){let r=parseHash();if(!r){r={lang:'de',page:'start'};try{history.replaceState(null,'',location.pathname+location.search+hashFor('de','start'));}catch(err){}}state.lang=r.lang;state.page=r.page;render();window.scrollTo(0,0);const h=main.querySelector('h1');if(navigated&&h)h.focus({preventScroll:true});navigated=true;}
function render(){const u=ui();app.setAttribute('lang',state.lang);document.documentElement.lang=state.lang;hdr.innerHTML=headerHTML();main.innerHTML=views[state.page]();foot.innerHTML=footerHTML();document.title='Scutoria · '+u[state.page];afterRender();}
function afterRender(){main.querySelectorAll('.section').forEach((s,i)=>{s.style.setProperty('--d',Math.min(i*40,400)+'ms');s.classList.add('enter');});observe();updateHow();const s=$('#libSearch');if(s)s.value=state.search;}
function observe(){if(io)io.disconnect();const els=main.querySelectorAll('[data-reveal]');if(!('IntersectionObserver' in window)){els.forEach(el=>el.classList.add('drawn'));return;}io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('drawn');io.unobserve(en.target);}});},{threshold:.3});els.forEach(el=>io.observe(el));}
function updateHow(){const f=document.getElementById('howFill');if(!f)return;const sec=f.closest('.how');const r=sec.getBoundingClientRect();const vh=window.innerHeight||800;const p=Math.min(1,Math.max(0,(vh*.85-r.top)/(r.height*.8||1)));f.style.transform='scaleX('+p.toFixed(3)+')';}
function applyMotion(){document.documentElement.classList.toggle('no-motion',!state.motion);}
function openDialog(html){if(!dlg.open)returnFocus=document.activeElement;$('#dlgIn').innerHTML=html+'<button type="button" class="btn-ghost" data-act="close">'+esc(ui().close)+'</button>';if(!dlg.open)dlg.showModal();$('#dlgIn h2')&&$('#dlgIn h2').setAttribute('tabindex','-1');}
function scrollRow(id,dir){const r=document.getElementById(id);if(!r)return;const c=r.firstElementChild;const w=c?c.getBoundingClientRect().width+16:300;r.scrollBy({left:dir*w*2,behavior:state.motion?'smooth':'auto'});}
function playSteps(){const steps=Array.from(document.querySelectorAll('#stage .step'));const lines=Array.from(document.querySelectorAll('#stage .sheet-line'));steps.forEach(s=>s.classList.remove('on'));lines.forEach(l=>l.classList.remove('hl'));const d=state.motion?700:0;[0,1,2].forEach(i=>setTimeout(()=>{if(steps[i])steps[i].classList.add('on');if(i>0&&lines[i-1])lines[i-1].classList.add('hl');},d*i));}
function setSituation(i){state.situation=i;document.querySelectorAll('.pills button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));const st=$('#stage');if(st)st.innerHTML=stageInner(SC.situations[i],'swap');}
function setPressed(sel,test){document.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',String(test(b))));}
function runDemo(){const inp=$('#demoIn'),out=$('#demoOut');if(!inp||!out)return;out.textContent=inp.value.replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g,state.lang==='de'?'[E-Mail entfernt]':'[email removed]');}
function scrollTo(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:state.motion?'smooth':'auto',block:'start'});}
document.addEventListener('click',e=>{
 const a=e.target.closest('a[data-product]');
 if(a){state.product=a.dataset.product;state.tab=0;if(location.hash===a.getAttribute('href')){e.preventDefault();render();window.scrollTo(0,0);}return;}
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
 switch(act){
  case 'sit':setSituation(Number(el.dataset.i));break;
  case 'play':playSteps();break;
  case 'sample':openDialog(dlgSample(el.dataset.product));break;
  case 'scroll':scrollTo(el.dataset.target);break;
  case 'video':openDialog(dlgVideo(el.dataset.no));break;
  case 'short':openDialog(dlgShort(el.dataset.id));break;
  case 'concept':openDialog(dlgConcept(el.dataset.no));break;
  case 'concept-tool':openDialog(dlgConceptTool(el.dataset.id));break;
  case 'prep':openDialog(dlgPrep(el.dataset.id));break;
  case 'row':scrollRow(el.dataset.row,Number(el.dataset.dir));break;
  case 'motion':state.motion=!state.motion;applyMotion();el.setAttribute('aria-pressed',String(state.motion));el.textContent=state.motion?ui().motionOn:ui().motionOff;updateHow();break;
  case 'filter':state.filter=Number(el.dataset.i);setPressed('.filters [data-act=filter]',b=>Number(b.dataset.i)===state.filter);$('#libRows').innerHTML=libRows();break;
  case 'tab':{state.tab=Number(el.dataset.i);document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.i)===state.tab)));const old=$('#panel');const n=old.cloneNode(false);n.innerHTML=productPanel(currentProduct());old.replaceWith(n);break;}
  case 'tool':state.tool=Number(el.dataset.i);render();{const b=document.querySelector('.tool-list button[aria-pressed=true]');if(b)b.focus({preventScroll:true});}break;
  case 'stopic':state.sTopic=el.dataset.k;setPressed('.filters [data-act=stopic]',b=>b.dataset.k===state.sTopic);$('#studioBody').innerHTML=studioBody();break;
  case 'sformat':state.sFormat=el.dataset.k;setPressed('.filters [data-act=sformat]',b=>b.dataset.k===state.sFormat);$('#studioBody').innerHTML=studioBody();break;
  case 'demo-run':runDemo();break;
  case 'close':dlg.close();break;
 }
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-act=waitlist]');if(!f)return;e.preventDefault();const m=$('#wlMsg');if(m)m.textContent=ui().waitlistDraft;});
document.addEventListener('input',e=>{if(e.target.id==='libSearch'){state.search=e.target.value;$('#libRows').innerHTML=libRows();}else if(e.target.id==='demoIn'){state.demoText=e.target.value;}});
dlg.addEventListener('close',()=>{if(returnFocus&&document.contains(returnFocus))returnFocus.focus({preventScroll:true});returnFocus=null;});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
window.addEventListener('hashchange',route);
window.addEventListener('scroll',updateHow,{passive:true});
window.addEventListener('resize',updateHow);
applyMotion();
route();
})(typeof window!=='undefined'?window:globalThis);

</script>
